<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TermRepo 注册测试</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #171717;
      }

      .card {
        width: min(420px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 8px;
        box-shadow:
          rgba(0, 0, 0, 0.08) 0 0 0 1px,
          rgba(0, 0, 0, 0.04) 0 2px 2px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: -1.28px;
      }

      p {
        margin: 0 0 24px;
        color: #4d4d4d;
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 14px;
        font-weight: 500;
      }

      input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        outline: none;
        box-shadow: rgba(0, 0, 0, 0.08) 0 0 0 1px;
        font-size: 14px;
      }

      input:focus {
        outline: 2px solid hsla(212, 100%, 48%, 1);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        height: 40px;
        margin-top: 20px;
        border: 0;
        border-radius: 6px;
        background: #171717;
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      pre {
        min-height: 120px;
        margin: 20px 0 0;
        padding: 12px;
        overflow: auto;
        border-radius: 6px;
        background: #fafafa;
        box-shadow: rgba(0, 0, 0, 0.08) 0 0 0 1px;
        color: #171717;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>注册测试</h1>
      <p>提交到 http://localhost:3000/api/v1/auth/register</p>

      <form id="registerForm">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" value="test@example.com" required />

        <label for="username">用户名</label>
        <input id="username" name="username" type="text" value="test" required />

        <label for="password">密码</label>
        <input id="password" name="password" type="password" value="test1234" minlength="8" required />

        <button id="submitButton" type="submit">注册</button>
      </form>

      <pre id="result">等待提交...</pre>
    </main>

    <script>
      const API_URL = 'http://localhost:3000/api/v1/auth/register';
      const form = document.querySelector('#registerForm');
      const button = document.querySelector('#submitButton');
      const result = document.querySelector('#result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        result.textContent = '请求中...';

        const payload = {
          email: form.email.value.trim(),
          username: form.username.value.trim(),
          password: form.password.value,
        };

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          result.textContent = JSON.stringify({ httpStatus: response.status, response: data }, null, 2);
        } catch (error) {
          result.textContent = '请求失败：\n' + String(error);
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
